services:
  - type: web
    name: electrovolt-web
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r app/requirements.txt
    startCommand: streamlit run app/app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONPATH
        value: .
